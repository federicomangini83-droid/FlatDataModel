<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FinRep Flat Data Model</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <h1>FinRep Flat Data Model Creator</h1>
    <p class="subtitle">Tutta l'elaborazione avviene nel tuo browser: nessun file viene mai inviato a un server.</p>

    <section class="card">
      <label for="fileInput">1. Carica il file Excel (.xlsx)</label>
      <input type="file" id="fileInput" accept=".xlsx,.xls" />
    </section>

    <section class="card">
      <label for="startName">2. Parametri</label>
      <div class="params">
        <div>
          <label for="startName">Start name</label>
          <input type="text" id="startName" value="FR_" />
        </div>
        <div>
          <label for="endName">End name</label>
          <input type="text" id="endName" value="_420" />
        </div>
        <div>
          <label for="fileNamePrefix">Nome file (prefix)</label>
          <input type="text" id="fileNamePrefix" value="TGK_MAPPING" />
        </div>
      </div>
    </section>

    <section class="card">
      <button id="processBtn">Elabora file</button>
      <div id="spinner" class="spinner hidden"></div>
    </section>

    <section id="errorBox" class="error hidden"></section>

    <section id="resultBox" class="hidden">
      <h2>Risultato</h2>
      <p id="recordCount"></p>
      <div class="table-wrapper">
        <table id="resultTable"></table>
      </div>
      <button id="downloadBtn">Scarica CSV</button>
    </section>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <script src="js/finrepProcessor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
