<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinRep Flat Data Model Creator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <span class="brand">FinRep Flat Data Model Creator</span>
      <span class="badge">Elaborazione locale &middot; nessun file inviato a un server</span>
    </div>
  </header>

  <main class="container">

    <section id="errorBox" class="alert hidden" role="alert"></section>

    <section class="card">
      <h2>1. Carica il file Excel</h2>
      <p class="hint">Formati supportati: .xlsx, .xls</p>
      <input type="file" id="fileInput" accept=".xlsx,.xls" />
    </section>

    <section class="card">
      <h2>2. Parametri di output</h2>
      <div class="params">
        <div class="field">
          <label for="startName">Start name</label>
          <input type="text" id="startName" value="FR_" />
        </div>
        <div class="field">
          <label for="fileNamePrefix">Nome file (prefix)</label>
          <input type="text" id="fileNamePrefix" value="TGK_MAPPING" />
        </div>
        <div class="field">
          <label for="endName">End name</label>
          <input type="text" id="endName" value="_420" />
        </div>
      </div>
      <p class="hint">File generato: <code id="fileNamePreview">FR_TGK_MAPPING_420.csv</code></p>
    </section>

    <section class="card action-row">
      <button id="processBtn" type="button">Elabora file</button>
      <span id="spinner" class="spinner hidden"></span>
    </section>

    <section id="resultBox" class="card hidden">
      <h2>Risultato</h2>
      <p id="recordCount"></p>
      <div class="table-wrapper">
        <table id="resultTable"></table>
      </div>
      <button id="downloadBtn" type="button" class="button-secondary">Scarica CSV</button>
    </section>

  </main>

  <footer class="footer">FinRep Flat Data Model Creator</footer>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <script src="js/finrepProcessor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
