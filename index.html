<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinRep Flat Data Model Creator</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="container">
    <h1>FinRep Flat Data Model Creator</h1>
    <p class="subtitle">Elaborazione locale nel browser con il motore Python originale.</p>

    <section id="runtimeBox" class="card runtime-box" aria-live="polite">
      <strong id="runtimeStatus">Inizializzazione del motore Python...</strong>
      <span id="runtimeSpinner" class="spinner"></span>
    </section>

    <section class="card">
      <label for="fileInput">1. Carica il file Excel (.xlsx)</label>
      <input type="file" id="fileInput" accept=".xlsx" disabled />
    </section>

    <section class="card">
      <label for="startName">2. Parametri</label>
      <div class="params">
        <div><label for="startName">Start name</label><input type="text" id="startName" value="FR_" /></div>
        <div><label for="fileNamePrefix">Nome file (prefix)</label><input type="text" id="fileNamePrefix" value="TGK_MAPPING" /></div>
        <div><label for="endName">End name</label><input type="text" id="endName" value="_420" /></div>
      </div>
      <p class="filename-preview">File generato: <code id="fileNamePreview">FR_TGK_MAPPING_420.csv</code></p>
    </section>

    <section class="card action-row">
      <button id="processBtn" disabled>Elabora file</button>
      <div id="spinner" class="spinner hidden"></div>
    </section>

    <section id="errorBox" class="error hidden" role="alert"></section>

    <section id="resultBox" class="card hidden">
      <h2>Risultato</h2>
      <p id="recordCount"></p>
      <div class="table-wrapper"><table id="resultTable"></table></div>
      <button id="downloadBtn">Scarica CSV</button>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
