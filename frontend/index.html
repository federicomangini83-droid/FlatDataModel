<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinRep Flat Data Model Creator</title><link rel="stylesheet" href="./css/style.css"></head><body><main class="container"><h1>FinRep Flat Data Model Creator</h1><p class="subtitle">Elaborazione locale nel browser con motore Python.</p><section class="card"><label>1. Carica il file Excel (.xlsx)</label><input id="fileInput" type="file" accept=".xlsx"></section><section class="card"><label>2. Parametri</label><div class="params"><div><label>Start name</label><input id="startName" value="FR_"></div><div><label>Nome file (prefix)</label><input id="fileNamePrefix" value="TGK_MAPPING"></div><div><label>End name</label><input id="endName" value="_420"></div></div><p>File generato: <code id="fileNamePreview"></code></p></section><section class="card actions"><button id="processBtn">Elabora file</button><span id="spinner" class="spinner hidden"></span></section><section id="errorBox" class="error hidden"></section><section id="resultBox" class="card hidden"><h2>Risultato</h2><p id="recordCount"></p><div class="table-wrapper"><table id="resultTable"></table></div><button id="downloadBtn">Scarica CSV</button><p id="archiveStatus"></p></section><section class="card"><div class="history-head"><div><h2>Storico CSV</h2><p>File salvati nella REST API.</p></div><button id="refreshHistoryBtn" class="secondary">Aggiorna</button></div><div id="historyError" class="error hidden"></div><div class="table-wrapper"><table id="historyTable"><thead><tr><th>Nome</th><th>Data</th><th>Record</th><th>Dimensione</th><th>Azioni</th></tr></thead><tbody></tbody></table></div></section></main><script>window.APP_CONFIG={apiBaseUrl:"https://YOUR-WORKER.workers.dev",apiKey:"CHANGE_ME"};</script><script src="https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js"></script><script src="./js/app.js"></script></body></html>
